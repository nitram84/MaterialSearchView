plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 23
        versionCode 1
        versionName "1.4.0"
    }
    namespace 'com.miguelcatalan.materialsearchview'
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        disable 'GradleCompatible', 'ExpiredTargetSdkVersion'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:23.1.1'
    implementation 'com.android.support:design:23.1.1'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.nitram84'
            artifactId = 'materialsearchview'
            version = '1.4.0-SNAPSHOT'
            afterEvaluate {
                from components.release
            }
            pom {
                name = 'materialsearchview'
                description = 'Cute library to implement SearchView in a Material Design Approach'
                url = 'https://github.com/MiguelCatalan/MaterialSearchView'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/MiguelCatalan/MaterialSearchView.git'
                    url = 'https://github.com/MiguelCatalan/MaterialSearchView'
                }
            }
        }
    }
}
